<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 530 112" role="img" aria-labelledby="title desc"><title id="title">ABE TechLab wordmark</title><desc id="desc">Standalone ABE TechLab typographic wordmark. Transparent background. Lettering adapts between charcoal and off-white with the preferred color scheme.</desc><style>.ink{fill:#111111}.accent{fill:#A7E021}@media(prefers-color-scheme:dark){.ink{fill:#F9F9F6}}</style><text class="ink" x="5" y="86" font-family="Arial, Helvetica, sans-serif" font-size="82" font-weight="700">ABE</text><text class="ink" x="196" y="86" font-family="Arial, Helvetica, sans-serif" font-size="82" font-weight="500">TechLab</text></svg>