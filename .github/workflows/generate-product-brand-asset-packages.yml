name: Generate and validate product brand asset packages

on:
  push:
    branches:
      - brand/abemail-techtrack-logo-packages
    paths:
      - "brands/abemail/source/**"
      - "brands/techtrack/source/**"
      - "brands/techtrack-kids/source/**"
      - "scripts/export_product_brand_asset_packages.py"
      - ".github/workflows/generate-product-brand-asset-packages.yml"
  pull_request:
    branches:
      - main
    paths:
      - "brands/abemail/**"
      - "brands/techtrack/**"
      - "brands/techtrack-kids/**"
      - "scripts/export_product_brand_asset_packages.py"
      - ".github/workflows/generate-product-brand-asset-packages.yml"

permissions:
  contents: write

jobs:
  generate-assets:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Inter font and Cairo libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-inter libcairo2 libffi-dev
          fc-cache -f
          fc-match Inter

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install raster and SVG rendering dependencies
        run: python -m pip install "Pillow>=10,<13" "CairoSVG>=2.7,<3"

      - name: Generate vector and raster-derived product packages
        if: github.event_name == 'push'
        run: python scripts/export_product_brand_asset_packages.py

      - name: Commit generated logo variants and public assets
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            brands/abemail/logos brands/abemail/inventory.json \
            brands/techtrack/logos brands/techtrack/inventory.json \
            brands/techtrack-kids/logos brands/techtrack-kids/inventory.json \
            public/brands
          if git diff --cached --quiet; then
            echo "Product logo exports are already current."
            exit 0
          fi
          git commit -m "Generate ABEmail and TechTrack logo variants"
          git push

      - name: Re-render to a clean temporary directory for PR validation
        if: github.event_name == 'pull_request'
        run: |
          python scripts/export_product_brand_asset_packages.py \
            --package-root /tmp/expected-brands \
            --public-root /tmp/expected-public \
            --inventory-dir /tmp/expected-inventory

      - name: Compare generated exports against committed assets
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          for brand in abemail techtrack techtrack-kids; do
            diff -qr "/tmp/expected-brands/$brand/logos" "brands/$brand/logos"
            cmp "/tmp/expected-inventory/$brand/inventory.json" "brands/$brand/inventory.json"
            diff -qr "/tmp/expected-public/$brand" "public/brands/$brand"
            echo "Verified reproducible asset package: $brand"
          done

      - name: Upload rendered package preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abemail-techtrack-product-brand-assets
          path: |
            brands/abemail/logos/png/*.png
            brands/techtrack/logos/png/*.png
            brands/techtrack-kids/logos/png/*.png
          if-no-files-found: warn
          retention-days: 14
