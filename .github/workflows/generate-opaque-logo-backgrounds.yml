name: Generate and validate opaque logo backgrounds

on:
  push:
    paths:
      - "scripts/export_logo_background_variants.py"
      - "public/logos/*-adaptive.svg"
  pull_request:
    branches:
      - main
    paths:
      - "public/logos/**"
      - "scripts/export_logo_background_variants.py"
      - "scripts/requirements-brand-assets.txt"
      - ".github/workflows/generate-opaque-logo-backgrounds.yml"

permissions:
  contents: write

jobs:
  opaque-logo-backgrounds:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install image export dependencies
        run: python -m pip install -r scripts/requirements-brand-assets.txt

      - name: Generate PNGs on the asset branch
        if: github.event_name == 'push'
        run: python scripts/export_logo_background_variants.py --output-dir public/logos

      - name: Commit generated PNGs to the asset branch
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/logos/abe-techlab-*-bg-*-v1.png
          if git diff --cached --quiet; then
            echo "Opaque logo PNGs are already up to date."
            exit 0
          fi
          git commit -m "Add opaque ABE logo background PNG variants"
          # Rebase the generated commit if repository metadata changes landed after checkout.
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push

      - name: Regenerate expected PNGs for pull request comparison
        if: github.event_name == 'pull_request'
        run: python scripts/export_logo_background_variants.py --output-dir /tmp/expected-logo-background-pngs

      - name: Verify committed PNGs match SVG source exports
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            abe-techlab-mark-bg-white-v1.png \
            abe-techlab-mark-bg-black-v1.png \
            abe-techlab-mark-bg-lemon-v1.png \
            abe-techlab-lockup-stacked-bg-white-v1.png \
            abe-techlab-lockup-stacked-bg-black-v1.png \
            abe-techlab-lockup-stacked-bg-lemon-v1.png \
            abe-techlab-lockup-horizontal-bg-white-v1.png \
            abe-techlab-lockup-horizontal-bg-black-v1.png \
            abe-techlab-lockup-horizontal-bg-lemon-v1.png \
            abe-techlab-wordmark-bg-white-v1.png \
            abe-techlab-wordmark-bg-black-v1.png \
            abe-techlab-wordmark-bg-lemon-v1.png; do
            if ! cmp --silent "/tmp/expected-logo-background-pngs/$file" "public/logos/$file"; then
              echo "PNG export is missing, stale, or differs from the SVG source: $file"
              exit 1
            fi
            echo "Verified: $file"
          done

      - name: Upload generated PNG preview files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abe-techlab-opaque-logo-background-pngs
          path: public/logos/abe-techlab-*-bg-*-v1.png
          if-no-files-found: warn
          retention-days: 14
