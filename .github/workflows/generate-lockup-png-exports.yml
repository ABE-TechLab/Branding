name: Generate lockup PNG exports

on:
  push:
    branches:
      - feat/logo-lockup-png-exports

permissions:
  contents: write

concurrency:
  group: branding-png-export-{ github.ref }
  cancel-in-progress: true

jobs:
  export:
    if: github.ref == 'refs/heads/feat/logo-lockup-png-exports'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the export branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install raster export dependencies
        run: python -m pip install -r scripts/requirements-brand-assets.txt

      - name: Render and validate the PNG exports
        run: python scripts/export_logo_variants.py --output-dir public/logos

      - name: Commit generated PNGs to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/logos/abe-techlab-lockup-stacked-light-v1.png public/logos/abe-techlab-lockup-stacked-dark-v1.png
          git add public/logos/abe-techlab-lockup-horizontal-light-v1.png public/logos/abe-techlab-lockup-horizontal-dark-v1.png
          git add public/logos/abe-techlab-wordmark-light-v1.png public/logos/abe-techlab-wordmark-dark-v1.png
          if git diff --cached --quiet; then
            echo "PNG exports are already current."
          else
            git commit -m "Generate validated light and dark logo PNG exports"
            git push origin HEAD:feat/logo-lockup-png-exports
          fi
